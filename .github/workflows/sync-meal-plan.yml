name: Sync Paprika Meal Plan

on:
  schedule:
    # Runs at the top of every hour. Edit the cron expression to change
    # frequency (e.g. "0 */3 * * *" for every 3 hours).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

# Queue runs instead of letting two overlap - if a scheduled run fires while
# a manual run (or another scheduled run) is still committing/pushing, the
# second one waits rather than racing the first for the same push, which is
# what causes "failed to push some refs (non-fast-forward)" errors.
concurrency:
  group: sync-paprika-meal-plan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch meal plan from Paprika
        env:
          PAPRIKA_EMAIL: ${{ secrets.PAPRIKA_EMAIL }}
          PAPRIKA_PASSWORD: ${{ secrets.PAPRIKA_PASSWORD }}
        run: python fetch_meal_plan.py

      - name: Commit updated meal plan files (only if they changed)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update meal plan"
          file_pattern: meal-plan.json index.html
