name: Sync Paprika Meal Plan

on:
  schedule:
    # Runs at the top of every hour. Edit the cron expression to change
    # frequency (e.g. "0 */3 * * *" for every 3 hours).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new one queues behind an in-progress
# one rather than racing it (this is the standard concurrency setup GitHub
# recommends for Pages deployments).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the meal plan page into _site/
        env:
          PAPRIKA_EMAIL: ${{ secrets.PAPRIKA_EMAIL }}
          PAPRIKA_PASSWORD: ${{ secrets.PAPRIKA_PASSWORD }}
          OUTPUT_DIR: _site
        run: |
          mkdir -p _site
          cp style.css _site/style.css
          python fetch_meal_plan.py

      - name: Upload build output as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
