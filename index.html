<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal plan</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background-color: transparent;
    color: #f2f2f0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .meal, .day, .header {
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
  }
  .card {
    width: 500px;
    margin: 0 auto;
    padding: 14px 16px 10px;
  }
  .header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8a8f98;
    margin-bottom: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6d7178;
    font-weight: 500;
    padding: 0 0 6px;
    border-bottom: 1px solid #2a2d31;
  }
  th.day-col { width: 78px; }
  th.meal-col { width: 46%; }
  td {
    padding: 6px 0;
    border-bottom: 1px solid #222427;
    vertical-align: top;
    font-size: 13px;
  }
  tr:last-child td { border-bottom: none; }
  td.day {
    color: #8a8f98;
    font-size: 12px;
    padding-right: 8px;
    white-space: nowrap;
  }
  td.meal {
    padding-right: 10px;
    font-weight: 500;
    line-height: 1.3;
  }
  td.meal.empty {
    color: #4a4d52;
    font-weight: 400;
  }
  tr.past td.day,
  tr.past td.meal {
    color: #4d4f53;
  }
  tr.past td.meal.empty {
    color: #35373a;
  }
  tr.today td {
    background: #1f232a;
    font-weight: 700;
  }
  tr.today td.day {
    color: #d8dade;
    font-weight: 700;
  }
  tr.today td.meal.empty {
    color: #6b6e73;
    font-weight: 400;
  }
  .footer {
    font-size: 10px;
    color: #54585e;
    text-align: right;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">This week's meals</div>
  <table>
    <tr>
      <th class="day-col"></th>
      <th class="meal-col">Dinner</th>
      <th class="meal-col">Lunch</th>
    </tr>
    <tr class="past">
      <td class="day">Fri 9/18</td>
      <td class="meal">Sandwiches</td>
      <td class="meal">(E,G)</td>
    </tr>
    <tr class="past">
      <td class="day">Sat 9/19</td>
      <td class="meal">BBQ Pizza</td>
      <td class="meal empty">–</td>
    </tr>
    <tr class="past">
      <td class="day">Sun 9/20</td>
      <td class="meal">G&amp;G’s</td>
      <td class="meal empty">–</td>
    </tr>
    <tr class="past">
      <td class="day">Mon 9/21</td>
      <td class="meal">Golden Curry</td>
      <td class="meal empty">–</td>
    </tr>
    <tr class="past">
      <td class="day">Tue 9/22</td>
      <td class="meal">Spaghetti, Bread</td>
      <td class="meal empty">–</td>
    </tr>
    <tr class="today">
      <td class="day">Wed 9/23</td>
      <td class="meal">Takeout</td>
      <td class="meal empty">–</td>
    </tr>
    <tr>
      <td class="day">Thu 9/24</td>
      <td class="meal">L/O Curry</td>
      <td class="meal empty">–</td>
    </tr>
  </table>
  <div class="footer">Updated Wed Sep 23, 4:51 AM</div>
</div>
</body>
</html>
